<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="撥雲見日">
<meta name="theme-color" content="#0b1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preload" as="image" href="a/s1.jpg">
<title>撥雲見日</title>
<style>
:root{--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.22);--txt:#f4f7f2;--soft:rgba(244,247,242,.7);--gold:#ffe9b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1410;color:var(--txt);font-family:-apple-system,"PingFang TC","Noto Sans TC","Heiti TC",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;animation:drift 40s ease-in-out infinite alternate;will-change:transform,opacity}
.bg.on{opacity:1}
@keyframes drift{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.5%,-1%,0)}}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55));pointer-events:none}
.mist{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 70%,rgba(255,255,255,.12),transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(255,255,255,.08),transparent 55%);animation:mist 18s ease-in-out infinite alternate;transition:opacity 2s}
@keyframes mist{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
/* top bar */
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;align-items:center;justify-content:space-between;z-index:5}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.75;font-size:18px}
.icon:active{transform:scale(.92)}
.icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:9px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .6s}
.dot.done{background:rgba(255,255,255,.85)}
.dot.cur{width:9px;height:9px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.stage-name{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:0;right:0;text-align:center;font-size:13px;letter-spacing:.3em;color:var(--soft);z-index:4;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.count{display:block;margin-top:4px;font-size:11px;letter-spacing:.15em;opacity:.8}
/* input */
.composer{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:5;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);padding:14px 14px 10px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
textarea{width:100%;min-height:96px;max-height:40vh;resize:none;border:0;outline:0;background:transparent;color:var(--txt);font-size:18px;line-height:1.6;font-family:inherit}
textarea::placeholder{color:rgba(255,255,255,.6)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.hint{font-size:12px;color:var(--soft);letter-spacing:.08em}
.btns{display:flex;gap:8px}
.mic,.save{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.mic{background:rgba(255,255,255,.12)}
.mic.rec{background:rgba(255,120,120,.45);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,120,120,.15)}}
.save{background:rgba(255,233,176,.9);color:#2a2414}
.save:disabled{opacity:.35}
.mic svg,.save svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer.sent{transform:translateY(-30px);opacity:0}
/* orb */
.orb{position:fixed;width:18px;height:18px;border-radius:50%;z-index:6;pointer-events:none;background:radial-gradient(circle,#fff 0,#fff6d6 35%,rgba(255,226,140,.5) 60%,transparent 72%);box-shadow:0 0 30px 12px rgba(255,230,160,.55),0 0 80px 30px rgba(255,230,160,.25)}
/* praise */
.praise{position:absolute;left:24px;right:24px;top:38%;text-align:center;z-index:6;font-size:22px;line-height:1.6;letter-spacing:.06em;text-shadow:0 2px 14px rgba(0,0,0,.6);opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s;pointer-events:none}
.praise.show{opacity:1;transform:none}
.praise small{display:block;font-size:13px;color:var(--soft);margin-top:10px;letter-spacing:.2em}
/* video overlay */
#vwrap{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#vwrap.on{opacity:1;pointer-events:auto}
#vwrap video{width:100%;height:100%;object-fit:cover}
#skip{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);font-size:13px;color:rgba(255,255,255,.7);padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.3)}
/* sheets */
.veil{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:78vh;overflow:auto;background:rgba(18,26,22,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:4px auto 14px}
.sheet h3{margin:0 0 12px;font-size:16px;font-weight:600;letter-spacing:.1em}
.item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.item time{display:block;font-size:11px;color:var(--soft);margin-bottom:3px}
.empty{color:var(--soft);font-size:14px;padding:20px 0;text-align:center}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.opt small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s}
.sw.on{background:#c9a94f}.sw.on::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.chip{padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.12);font-size:13px}
.danger{color:#ff9c9c}
.ver{font-size:11px;color:var(--soft);text-align:center;margin-top:14px}

.bg{transition:opacity 1.6s ease,filter 2s ease}
#app.raining .bg{filter:brightness(.78) saturate(.62) blur(2px)}
#app.raining .mist{opacity:0!important}
.rainveil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(40,55,70,.35),rgba(20,30,40,.2));opacity:0;transition:opacity 2s ease}
#app.raining .rainveil{opacity:1}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2s ease}
#app.raining canvas.fx{opacity:1}
#app.snowing .bg{filter:saturate(.42) brightness(1.07) contrast(.9) hue-rotate(8deg)}
.snowveil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(200,214,232,.22),rgba(160,178,200,.12));mix-blend-mode:screen;opacity:0;transition:opacity 2.4s ease}
#app.snowing .snowveil{opacity:1}
#app.snowing .mist{opacity:.5!important}
canvas.sfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2.4s ease}
#app.snowing canvas.sfx{opacity:1}
.icon.on{background:rgba(201,169,79,.55);opacity:1}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 210px);transform:translate(-50%,8px);z-index:7;max-width:86%;padding:9px 16px;border-radius:18px;background:rgba(20,28,24,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);font-size:14px;line-height:1.5;text-align:center;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--gold);font-weight:600;display:block;font-size:13px;letter-spacing:.08em}
.ext{display:none;align-items:center;gap:8px;font-size:12px;color:var(--gold);margin-bottom:6px}
.ext.on{display:flex}
.ext span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-style:italic;color:rgba(255,233,176,.8)}
.ext button{font-size:14px;opacity:.8;padding:0 4px}
.item .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--soft);margin-bottom:3px}
.item .meta time{margin:0}
.cdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.cdot.business{background:#d8b860}.cdot.mood{background:#9db4e0}.cdot.general{background:#a9d4b4}
.item .extbtn{margin-left:auto;font-size:12px;color:var(--gold);padding:2px 8px;border-radius:10px;background:rgba(201,169,79,.15)}
.item .more{font-size:15px;color:var(--soft);padding:0 6px;letter-spacing:.1em}
.item .extbtn+.more{margin-left:0}.item .meta .more:first-of-type{margin-left:auto}
.pin{width:11px;height:11px;fill:var(--gold);opacity:.8}
.acts{display:none;gap:8px;margin:6px 0 2px}
.acts.on{display:flex}
.acts button{font-size:12px;padding:5px 12px;border-radius:12px;background:rgba(255,255,255,.1)}
.acts .del{color:#ff9c9c}
.ghead{font-size:12px;color:var(--soft);letter-spacing:.2em;margin:16px 0 2px}
.ghead:first-child{margin-top:0}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lhead h3{margin:0;flex:1}
.lhead button{font-size:12px;color:var(--gold);padding:5px 10px;border-radius:12px;background:rgba(201,169,79,.14)}
.snack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translate(-50%,10px);z-index:40;padding:9px 16px;border-radius:16px;background:rgba(20,28,24,.9);font-size:13px;opacity:0;transition:all .35s;pointer-events:none}
.snack.show{opacity:1;transform:translate(-50%,0)}
.item.child{border-left:2px solid rgba(201,169,79,.35);padding-left:12px;margin-left:var(--ind,12px);border-bottom:0;padding-top:8px;padding-bottom:8px}

.qcard{margin:0 4px 10px;padding:12px 12px 8px 14px;border-radius:18px;background:rgba(255,248,230,.13);border:1px solid rgba(255,233,176,.24);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;pointer-events:none;display:none;align-items:center;flex-wrap:wrap;gap:4px}
.qcard.show{display:flex;opacity:1;transform:none;pointer-events:auto;animation:qin .5s ease}
@keyframes qin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qtext{flex:1 1 100%;font-size:16px;line-height:1.55;font-style:italic;letter-spacing:.02em;cursor:pointer;padding-bottom:2px}
.qbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--soft);font-size:13px;border-radius:50%}
.qbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qpause{margin-right:auto;font-size:12px;color:rgba(255,233,176,.85);padding:4px 2px;letter-spacing:.06em}
.qdot,.qmini{display:none}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.qmini{font-size:12px;color:var(--soft);cursor:pointer;padding:0 4px}
.qcard.mini{display:inline-flex;padding:4px 6px 4px 12px;border-radius:16px;margin-left:8px;gap:6px}
.qcard.mini .qtext,.qcard.mini #qSwap,.qcard.mini .qpause{display:none}
.qcard.mini .qdot,.qcard.mini .qmini{display:inline-block}
.starter{font-size:12px;color:var(--gold);letter-spacing:.08em;padding:4px 10px;border-radius:12px;background:rgba(201,169,79,.16);display:none}
.starter.show{display:inline-block;animation:qin .6s ease}
.hint.hide{display:none}
.glowring{position:fixed;left:50%;top:40%;width:260px;height:260px;border-radius:50%;z-index:6;pointer-events:none;background:radial-gradient(circle,rgba(255,240,190,.55),rgba(255,226,140,.18) 45%,transparent 70%)}
.item .qline{font-size:12px;color:rgba(244,247,242,.5);margin-bottom:2px}
.item.done{box-shadow:inset 3px 0 0 rgba(255,233,176,.55);padding-left:10px}

/* settings choices */
.sgroup{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.slabel{font-size:15px;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-size:13px;padding:7px 14px;border-radius:16px;background:rgba(255,255,255,.1);transition:all .3s}
.seg button.sel{background:rgba(201,169,79,.55);color:#fff}
/* feeling words */
.qchips{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.qchips button{font-size:13px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.12)}
.qcard.mini .qchips{display:none!important}
/* welcome + onboarding */
.ov{position:fixed;inset:0;z-index:60;display:none;opacity:0;transition:opacity .9s ease;overflow:hidden;background:#0b1410}
.ov.on{display:block}.ov.vis{opacity:1}
.wbg{position:absolute;inset:-6%;background-size:cover;background-position:center;transition:transform 1.6s cubic-bezier(.5,0,.8,.4),filter 1.6s ease}
.wbg.kb{animation:kb 32s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.16) translate3d(-2%,-1.5%,0)}}
.wmist{position:absolute;inset:-20% -40%;pointer-events:none;opacity:.55;background:radial-gradient(ellipse 40% 25% at 30% 60%,rgba(255,255,255,.22),transparent 70%),radial-gradient(ellipse 35% 20% at 70% 40%,rgba(255,255,255,.16),transparent 70%)}
.wmist.m1{animation:md 46s linear infinite alternate}.wmist.m2{animation:md 70s linear infinite alternate-reverse;opacity:.4}
@keyframes md{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.wshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.55))}
.wfol{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,transparent 0,transparent 30%,rgba(12,30,16,.85) 62%,#07120a 80%);transform:scale(2.4);transition:transform 1.5s cubic-bezier(.6,0,.4,1),opacity .6s ease}
#welcome.through .wbg{transform:scale(2.3);filter:blur(14px) brightness(.55)}
#welcome.through .wfol{opacity:1;transform:scale(.6)}
#welcome.through .wcontent{opacity:0;transform:translateY(-20px) scale(.96)}
.wcontent{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13vh);text-align:center;padding:0 28px;transition:all .8s ease}
.wcontent h1{font-size:40px;font-weight:300;letter-spacing:.42em;margin:0 0 20px;padding-left:.42em;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.wline{font-size:17px;letter-spacing:.14em;margin:0 0 8px;color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.wsub{font-size:13px;letter-spacing:.3em;color:var(--soft);margin:0 0 44px}
.wgo{font-size:17px;letter-spacing:.3em;padding:15px 40px 15px 46px;border-radius:30px;background:rgba(255,248,230,.16);border:1px solid rgba(255,233,176,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff8e6;box-shadow:0 0 30px rgba(255,233,176,.15);animation:glowb 3.2s ease-in-out infinite}
@keyframes glowb{50%{box-shadow:0 0 40px rgba(255,233,176,.35)}}
.wgo:active{transform:scale(.97)}
.wgo.small{font-size:15px;padding:12px 30px 12px 34px;margin-top:22px;opacity:0;pointer-events:none;transition:opacity .5s}
.wgo.small.show{opacity:1;pointer-events:auto}
.obg{filter:blur(6px) brightness(.55);transform:scale(1.1)}
.oskip{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;font-size:13px;color:var(--soft);padding:6px 10px;z-index:2}
.ostep{position:absolute;left:0;right:0;top:50%;transform:translateY(-45%);padding:0 22px;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
.ostep.on{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.ostep h2{font-size:22px;font-weight:400;letter-spacing:.12em;margin:0 0 26px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.ohint{font-size:12px;color:var(--soft);margin:-14px 0 18px;letter-spacing:.1em}
.ocards{display:flex;flex-direction:column;gap:12px}
.ocards.two{flex-direction:row}.ocards.two .ocard{flex:1}
.ocards.grid{display:grid;grid-template-columns:1fr 1fr}
.ocard{display:block;text-align:left;padding:18px 18px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .35s}
.ocard b{display:block;font-size:18px;font-weight:500;letter-spacing:.1em}
.ocard span{display:block;font-size:12px;color:var(--soft);margin-top:4px;letter-spacing:.05em}
.ocard.sel{background:rgba(255,233,176,.24);border-color:rgba(255,233,176,.7);box-shadow:0 0 24px rgba(255,233,176,.2)}
.ocard.pic{padding:8px 8px 12px;text-align:center}
.ocard.pic i{display:block;height:34vh;max-height:300px;border-radius:14px;background-size:cover;background-position:center;margin-bottom:10px;position:relative;overflow:hidden}
.ocard.pic i.rainy{filter:saturate(.65) brightness(.8)}
.ocard.pic i.rainy::after{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(220,230,245,.28) 9px 10px,transparent 10px 23px);animation:rainthumb .5s linear infinite}
@keyframes rainthumb{to{transform:translate(-6px,46px)}}
.ocards.three{gap:8px}.ocards.three .ocard.pic{padding:6px 6px 10px}.ocards.three .ocard b{font-size:15px;letter-spacing:.06em}
.ocard.pic i.snowy{filter:saturate(.3) brightness(1.15) contrast(.88) hue-rotate(10deg)}
.ocard.pic i.snowy::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 30% 40%,rgba(255,255,255,.85) 0 1px,transparent 1.6px),radial-gradient(circle at 70% 20%,rgba(255,255,255,.75) 0 1.6px,transparent 2.4px),radial-gradient(circle at 40% 60%,rgba(255,255,255,.55) 0 2.6px,transparent 4px);background-size:37px 41px,61px 67px,89px 97px;animation:snowthumb 12s linear infinite}
@keyframes snowthumb{from{background-position:0 0,13px 9px,31px 22px}to{background-position:0 41px,13px 143px,31px 313px}}
.ocards.grid .ocard:last-child:nth-child(odd){grid-column:span 2}
.odots{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);display:flex;justify-content:center;gap:8px}
.odots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .4s}
.odots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.oend{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:22px;letter-spacing:.3em;opacity:0;transition:opacity 1s ease;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.oend.on{opacity:1}
#onb.ending .ostep,#onb.ending .odots,#onb.ending .oskip{opacity:0!important;pointer-events:none}
@media (prefers-reduced-motion: reduce){.wbg.kb,.wmist{animation:none}.ocard.pic i.rainy::after,.ocard.pic i.snowy::after{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <div class="mist" id="mist"></div>
  <div class="rainveil"></div>
  <canvas class="fx" id="rainCv"></canvas>
  <canvas class="fx" id="glassCv"></canvas>
  <div class="snowveil"></div>
  <canvas class="sfx" id="snowCv"></canvas>
  <div class="shade"></div>

  <div class="top">
    <button class="icon" id="btnList" aria-label="點子清單"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
    <div class="dots" id="dots"></div>
    <div style="display:flex;gap:8px">
      <button class="icon" id="btnRain" aria-label="天氣"><svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 8a3.5 3.5 0 0 1 .5 7H7z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg></button>
      <button class="icon" id="btnSound" aria-label="森林的聲音"><svg viewBox="0 0 24 24" id="sndIcon"></svg></button>
      <button class="icon" id="btnSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div class="stage-name" id="stageName"></div>

  <div class="praise" id="praise"></div>
  <div class="toast" id="toast"></div>

  <div class="composer" id="composer">
    <div class="qcard" id="qcard"><span class="qdot"></span><div class="qtext" id="qText"></div><div class="qchips" id="qChips"></div><span class="qmini" id="qLabel">還想多說一點</span><button class="qpause" id="qPause">先到這裡</button><button class="qbtn" id="qSwap" aria-label="換個方向想"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button><button class="qbtn" id="qX" aria-label="先不用">✕</button></div>
    <div class="card" id="card">
      <div class="ext" id="ext"><span id="extTxt"></span><button id="extX" aria-label="放下這個問題">✕</button></div>
      <textarea id="ta" placeholder="有什麼點子冒出來了？" autofocus enterkeyhint="done"></textarea>
      <div class="row">
        <span><span class="hint" id="hint">寫好了，往上輕推就收下</span><button class="starter" id="starter">不知道寫什麼？</button></span>
        <div class="btns">
          <button class="mic" id="mic" aria-label="語音輸入" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="save" id="save" aria-label="收下點子" title="收下（⌘ / Ctrl + Enter）" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="vwrap"><video id="vid" muted playsinline webkit-playsinline preload="auto"></video><button id="skip">略過 ›</button></div>

<div class="veil" id="veil"></div>
<div class="sheet" id="listSheet"><div class="grab"></div><div class="lhead"><h3>我的點子</h3><button id="shareAll">分享全部</button></div><div id="list"></div></div>
<div class="snack" id="snack"></div>

<div id="welcome" class="ov">
  <div class="wbg kb" style="background-image:url(a/s1.jpg)"></div>
  <div class="wmist m1"></div><div class="wmist m2"></div>
  <div class="wfol"></div>
  <div class="wshade"></div>
  <div class="wcontent">
    <h1>撥雲見日</h1>
    <p class="wline">有些念頭，說出來就清楚了</p>
    <p class="wsub">陪你往前走</p>
    <button id="wGo" class="wgo">走進森林</button>
  </div>
</div>
<div id="onb" class="ov">
  <div class="wbg obg" style="background-image:url(a/s1.jpg)"></div><div class="wmist m1"></div><div class="wshade"></div>
  <button id="oSkip" class="oskip">先跳過</button>
  <section class="ostep" data-step="0">
    <h2>今天想寫點什麼？</h2>
    <div class="ocards">
      <button class="ocard" data-k="intent" data-v="idea"><b>想點子</b><span>工作、生意、想做的事</span></button>
      <button class="ocard" data-k="intent" data-v="mood"><b>整理心情</b><span>把心裡的霧說出來</span></button>
      <button class="ocard" data-k="intent" data-v="free"><b>隨便寫寫</b><span>想到什麼都可以</span></button>
    </div>
  </section>
  <section class="ostep" data-step="1">
    <h2>想待在哪片風景？</h2>
    <div class="ocards two three">
      <button class="ocard pic" data-k="scene" data-v="mist"><i style="background-image:url(a/s1.jpg)"></i><b>迷霧森林</b></button>
      <button class="ocard pic" data-k="scene" data-v="rain"><i class="rainy" style="background-image:url(a/s2.jpg)"></i><b>雨中森林</b></button>
      <button class="ocard pic" data-k="scene" data-v="snow"><i class="snowy" style="background-image:url(a/s1.jpg)"></i><b>雪落無聲</b></button>
    </div>
  </section>
  <section class="ostep" data-step="2">
    <h2>想聽什麼聲音？</h2>
    <p class="ohint">點一下，就能聽聽看</p>
    <div class="ocards grid">
      <button class="ocard" data-k="sound" data-v="rain"><b>細雨</b><span>窗外的小雨</span></button>
      <button class="ocard" data-k="sound" data-v="stream"><b>溪邊</b><span>小溪和幾隻鳥</span></button>
      <button class="ocard" data-k="sound" data-v="bowl"><b>頌缽</b><span>遠遠的一聲缽響</span></button>
      <button class="ocard" data-k="sound" data-v="snow"><b>雪</b><span>曠野的風，很靜</span></button>
      <button class="ocard" data-k="sound" data-v="quiet"><b>安靜</b><span>什麼都不放</span></button>
    </div>
    <button id="oNext" class="wgo small">就這樣</button>
  </section>
  <div class="odots"><i></i><i></i><i></i></div>
  <div class="oend" id="oEnd">好，我們出發</div>
</div>
<div class="sheet" id="setSheet"><div class="grab"></div><h3>設定</h3>
  <div class="sgroup"><div class="slabel">今天想寫點什麼</div><div class="seg"><button data-set="intent" data-v="idea">想點子</button><button data-set="intent" data-v="mood">整理心情</button><button data-set="intent" data-v="free">隨便寫寫</button></div></div>
  <div class="sgroup"><div class="slabel">風景</div><div class="seg"><button data-set="scene" data-v="mist">迷霧森林</button><button data-set="scene" data-v="rain">雨中森林</button><button data-set="scene" data-v="snow">雪落無聲</button></div></div>
  <div class="sgroup"><div class="slabel">聲音</div><div class="seg wrap"><button data-set="sound" data-v="rain">細雨</button><button data-set="sound" data-v="stream">溪邊</button><button data-set="sound" data-v="bowl">頌缽</button><button data-set="sound" data-v="forest">林間蟲鳴</button><button data-set="sound" data-v="snow">雪</button><button data-set="sound" data-v="quiet">安靜</button></div></div>
  <div class="opt"><div>遠方的低吟<small>很輕的底音，墊在聲音下面</small></div><button class="sw" id="swPad"></button></div>
  <div class="opt"><div>寫完後陪我多想一點<small>輕輕問你一句，想停隨時可以停</small></div><button class="sw" id="swFollow"></button></div>
  <div class="opt"><div>快速預覽場景<small>只要寫幾句，就能走過每一段風景（展示用）</small></div><button class="sw" id="swTest"></button></div>
  <div style="font-size:13px;color:var(--soft);margin-top:12px">看看每一段路</div>
  <div class="chips" id="chips"></div>
  <div class="opt"><div>把寫下的整理成檔案<small>可以放進備忘錄、Notion 或電腦裡</small></div><button class="chip" id="dlAll">存成檔案</button></div>
  <div class="opt"><div>重新走進森林<small>再看一次一開始的那片風景</small></div><button class="chip" id="reWelcome">走一次</button></div>
  <div class="opt"><div class="danger">清除所有點子並重來</div><button class="chip danger" id="reset">重設</button></div>
  <div class="ver">撥雲見日 · 你寫下的一切，只留在這支手機裡</div><!-- build v0.7 -->
</div>

<script src="feedback.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
